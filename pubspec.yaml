name: appwrite_flutter_starter_kit
description: "Appwrite StarterKit in Flutter"
publish_to: 'none'

version: 1.0.0

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.20.2
  appwrite: ^26.0.0
  url_launcher: ^6.3.1
  window_manager: ^0.5.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true